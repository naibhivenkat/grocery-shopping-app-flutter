name: Release from CI Artifacts (No Rebuild)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub Release from Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for context only)
        uses: actions/checkout@v4

      - name: Find latest successful CI run on default branch
        id: find_run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ✅ must match your CI workflow name exactly
            const workflowName = "CI Build (Android + iOS Artifacts)";

            // detect default branch
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch;

            // list workflows and find ID
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const wf = workflows.workflows.find(w => w.name === workflowName);
            if (!wf) throw new Error(`Workflow not found: ${workflowName}`);

            // list successful runs for default branch
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: wf.id,
              branch: defaultBranch,
              status: "success",
              per_page: 1
            });

            if (!runs.workflow_runs.length) throw new Error("No successful CI runs found.");

            const runId = runs.workflow_runs[0].id;
            core.setOutput("run_id", runId);
            core.setOutput("branch", defaultBranch);
            console.log("Using CI run:", runId, "branch:", defaultBranch);

      - name: Download Android artifact from CI run
        uses: dawidd6/action-download-artifact@v8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci-build.yml
          run_id: ${{ steps.find_run.outputs.run_id }}
          name: android-build
          path: dist/android

      - name: Download iOS artifact from CI run
        uses: dawidd6/action-download-artifact@v8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci-build.yml
          run_id: ${{ steps.find_run.outputs.run_id }}
          name: ios-runner-app
          path: dist/ios/Runner.app

      - name: Zip iOS Runner.app
        run: |
          cd dist/ios
          zip -r ios-runner-app.zip Runner.app
          ls -lh ios-runner-app.zip

      - name: List downloaded files
        run: |
          echo "Android files:"
          ls -lh dist/android || true
          echo "iOS zip:"
          ls -lh dist/ios/ios-runner-app.zip || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            dist/android/**/*.apk
            dist/android/**/app-release.aab
            dist/ios/ios-runner-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
