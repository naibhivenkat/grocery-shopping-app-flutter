name: Flutter CI (Android + iOS)

on:
  push:
    branches: ["flutter-dev", "main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["flutter-dev", "main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android Build (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore google-services.json (Android)
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Upload Android to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS Build (Self-hosted Mac - Simulator Release)
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix UTF-8 for CocoaPods
        run: |
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Xcode Info + SDK Check
        run: |
          echo "Xcode Path:"
          xcode-select -p
          echo "Xcode Version:"
          xcodebuild -version
          echo "SDKs:"
          xcodebuild -showsdks

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore GoogleService-Info.plist (iOS)
        run: |
          mkdir -p ios/Runner
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/Runner/GoogleService-Info.plist

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ✅ MAIN FIX: build for simulator (no iOS 17.5 device SDK needed)
      - name: Build iOS Simulator (Release)
        run: flutter build ios --simulator --release

      # ✅ Zip Simulator build only for tags
      - name: Zip iOS Simulator Build Output
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/ios/iphonesimulator
          zip -r ios-simulator-build.zip Runner.app
          ls -lh ios-simulator-build.zip

      # ✅ Upload zip only for tags
      - name: Upload iOS Simulator App to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: build/ios/iphonesimulator/ios-simulator-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
