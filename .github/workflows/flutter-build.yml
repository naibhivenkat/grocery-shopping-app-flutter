name: Flutter CI (Android + iOS)

on:
  push:
    branches: ["flutter-dev", "main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["flutter-dev", "main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android Build (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Set build number in pubspec.yaml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          sed -i "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore google-services.json (Android)
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Upload Android to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS Build (No Signing)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Print Xcode version
        run: xcodebuild -version


      - name: Set build number in pubspec.yaml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          sed -i '' "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Precache iOS Flutter artifacts
        run: flutter precache --ios

      - name: Restore GoogleService-Info.plist (iOS)
        run: |
          mkdir -p ios/Runner
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/Runner/GoogleService-Info.plist

      - name: Setup CocoaPods
        run: |
          sudo gem uninstall cocoapods -aIx || true
          sudo gem install cocoapods -v 1.16.2
          pod --version

      - name: Reset iOS Pods
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods
          rm -f Podfile.lock
          cd ..

      - name: Pod Install
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Zip iOS Build Output
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          zip -r ios-build.zip ios
          ls -lh ios-build.zip

      - name: Upload iOS to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: build/ios-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
