name: Flutter CI (Android + iOS)

on:
  push:
    branches: ["flutter-dev", "main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["flutter-dev", "main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android Build (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Set build number in pubspec.yaml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          sed -i "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore google-services.json (Android)
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      # ✅ Upload Android only on tag releases (v1.0.0)
      - name: Upload Android to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS Build (Self-hosted Mac - No Signing)
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix UTF-8 for CocoaPods
        run: |
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      # ✅ No sudo here (avoids password issue)
      - name: Xcode Info + iOS SDK Check
        run: |
          echo "Xcode Path:"
          xcode-select -p
          echo "Xcode Version:"
          xcodebuild -version
          echo "Installed SDKs:"
          xcodebuild -showsdks

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore GoogleService-Info.plist (iOS)
        run: |
          mkdir -p ios/Runner
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/Runner/GoogleService-Info.plist

      # ✅ Faster CocoaPods install
      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ✅ iOS Build - No Codesign
      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign

      # ✅ Zip iOS build only for tags
      - name: Zip iOS Build Output
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          zip -r ios-build.zip ios
          ls -lh ios-build.zip

      # ✅ Upload iOS zip only for tags
      - name: Upload iOS to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: build/ios-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
