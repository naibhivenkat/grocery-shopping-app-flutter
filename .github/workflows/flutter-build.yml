name: Flutter CI (Android + iOS)

on:
  push:
    branches: [ "flutter-dev", "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "flutter-dev", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android Build (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics (optional)
        run: flutter config --no-analytics

      # ✅ Auto increment build number using GitHub run number
      - name: Set build number in pubspec.yaml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          sed -i "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      # ✅ Restore Firebase google-services.json from GitHub Secret
      - name: Restore google-services.json (Android)
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      # ✅ Upload build outputs as Artifacts (every run)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # ✅ Upload to GitHub Releases ONLY when tag is pushed (v1.0.0)
      - name: Upload Android to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS Build (No Signing)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics (optional)
        run: flutter config --no-analytics

      # ✅ Auto increment build number for iOS too (macOS sed syntax)
      - name: Set build number in pubspec.yaml
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          sed -i '' "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign

      # ✅ Upload iOS build output as artifact (every run)
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios
