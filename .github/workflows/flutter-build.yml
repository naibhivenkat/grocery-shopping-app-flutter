  ios:
    name: iOS Build (macos-14 - No Signing)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Restore GoogleService-Info.plist (iOS)
        run: |
          mkdir -p ios/Runner
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/Runner/GoogleService-Info.plist

      # ✅ Must run before pod install (creates Generated.xcconfig)
      - name: Flutter Pub Get (Generate Generated.xcconfig)
        run: flutter pub get

      - name: Flutter Clean
        run: flutter clean

      # ✅ SAFE clean (do NOT touch ios/Flutter folder)
      - name: Clean iOS Pods (SAFE)
        run: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign
