name: Flutter Build (Android + iOS)

on:
  push:
    branches: [ "flutter-dev", "main", "master" ]
  pull_request:
    branches: [ "flutter-dev", "main", "master" ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics (optional)
        run: flutter config --no-analytics

      # ✅ Auto increment build number (+xxx)
      - name: Auto set build number (Android)
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          sed -i "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated pubspec.yaml version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      # ✅ Firebase json from secret (required for release build)
      - name: Create google-services.json
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS (No Signing)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics (optional)
        run: flutter config --no-analytics

      # ✅ Auto increment build number (+xxx) for iOS also
      - name: Auto set build number (iOS)
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Using build number: $BUILD_NUMBER"
          # macOS sed requires empty string after -i
          sed -i '' "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml
          echo "Updated pubspec.yaml version:"
          grep "version:" pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign

      # ✅ Upload iOS build output (not IPA)
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios


