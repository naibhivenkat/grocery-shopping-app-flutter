name: Flutter Build (Android + iOS)

on:
  push:
    branches: [ "flutter-dev", "main", "master" ]
  pull_request:
    branches: [ "flutter-dev", "main", "master" ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze (optional)
        run: flutter analyze || true

      - name: Run Tests (optional)
        run: flutter test || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS (No Signing)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      # Not always required, but helps if you use iOS plugins
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: iOS Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build Folder (for verification)
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios
