name: CI Build (Android + iOS Artifacts)

on:
  push:
   # branches: ["flutter-dev", "main", "master"]
   branches: "**"
  pull_request:
    branches: "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Build (Artifacts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Restore google-services.json (Android)
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS Build (Artifacts - No Signing)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter Analytics
        run: flutter config --no-analytics

      - name: Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Restore GoogleService-Info.plist (iOS)
        run: |
          mkdir -p ios/Runner
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/Runner/GoogleService-Info.plist

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Force Fresh CocoaPods
        run: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/.cocoapods/repos

      - name: Patch Razorpay iOS Plugin
        run: |
          PLUGIN_DIR="$HOME/.pub-cache/hosted/pub.dev/razorpay_flutter-1.4.5/ios/Classes"
      
          DELEGATE_FILE="$PLUGIN_DIR/RazorpayDelegate.swift"
          PLUGIN_FILE="$PLUGIN_DIR/SwiftRazorpayFlutterPlugin.swift"
      
          echo "Patching Razorpay plugin in: $PLUGIN_DIR"
      
          # ------------------------------------------------------
          # 1. Replace the unsupported SDK call inside the delegate
          #    razorpay.subscribeToAnalyticsEvents(events, callback: self)
          #    -> return
          # ------------------------------------------------------
          if [ -f "$DELEGATE_FILE" ]; then
            perl -0pi -e \
              's/razorpay\.subscribeToAnalyticsEvents\(events, callback: self\)/return/g' \
              "$DELEGATE_FILE"
          fi
      
          # ------------------------------------------------------
          # 2. Replace the plugin method invocation
          #    razorpayDelegate.subscribeToAnalyticsEvents(events: events)
          #    -> result(nil)
          # ------------------------------------------------------
          if [ -f "$PLUGIN_FILE" ]; then
            perl -0pi -e \
              's/razorpayDelegate\.subscribeToAnalyticsEvents\(events: events\)/result(nil)/g' \
              "$PLUGIN_FILE"
          fi
      
          # ------------------------------------------------------
          # 3. Verify only method definitions and switch labels remain
          # ------------------------------------------------------
          echo "Verifying patch..."
      
          if grep -n "razorpay\.subscribeToAnalyticsEvents" "$DELEGATE_FILE"; then
            echo "ERROR: Native Razorpay SDK call still exists."
            exit 1
          fi
      
          if grep -n "razorpayDelegate\.subscribeToAnalyticsEvents(events: events)" "$PLUGIN_FILE"; then
            echo "ERROR: Plugin method invocation still exists."
            exit 1
          fi
      
          echo "Razorpay plugin patched successfully."
      - name: Pod Install (Fresh)
        run: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build iOS (Release - No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Runner.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: build/ios/iphoneos/Runner.app
