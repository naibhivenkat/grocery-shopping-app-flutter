name: grocery_app_new_flutter
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.6.0
  pinput: ^6.0.1
  razorpay_flutter: ^1.4.5
  firebase_auth: ^6.1.4
  intl: ^0.20.2
  webview_flutter: ^4.13.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  geolocator: ^10.1.0
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.0
  uuid: ^4.0.0
  flutter_local_notifications: ^19.5.0
  lottie: ^3.1.0
  device_info_plus: ^10.1.0
  path_provider: ^2.1.5
  spreadsheet_decoder: ^2.3.0


  flutter_localizations:
    sdk: flutter
  table_calendar: ^3.2.0
  fl_chart: ^1.1.1
  google_maps_flutter: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/grocery_items.json
    - assets/images/
    - assets/images/fruits/
    - assets/images/vegetables/
    - assets/images/dairy/
    - assets/images/grains/
    - assets/app_logo.png
    - assets/data/Pooje_Item_list.xlsx
    - assets/fonts/NotoSerifKannada-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_logo.png"
